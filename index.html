<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my evil input</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: grid; grid-template-columns: 1fr 360px; align-items: center; text-align: center;
    background: #23243d;
  }

  .vol { font-size: 64px; margin: 0; line-height: 1.1; }
  button { font: inherit; color: inherit; background: #3f4168; border: 0; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid #eceae3; outline-offset: 2px; }
  .hint { color: #8d8aa6; font-size: 14px; margin: .8rem 0 0; }

  /* the drum: 100 balls, each one gone for good once drawn */
  #drum { display: grid; grid-template-columns: repeat(10, 30px); gap: 4px; justify-content: center; }
  .ball {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; color: #23243d; background: #eceae3;
    transition: opacity .3s, transform .2s, background .2s;
  }
  .ball.hot { background: #ffd166; transform: scale(1.25); }
  .ball.gone { opacity: .12; }
  .ball.last { background: #ffd166; opacity: 1; transform: scale(1.25); }
</style>
</head>
<body>
<div id="stage">
  <div>
    <p class="vol"><span id="vol">?</span>%</p>
    <button id="draw">draw a ball</button>
    <p class="hint" id="hint">100 balls in the drum. no ball goes back in.</p>
  </div>
  <div id="drum" aria-label="Lottery drum"></div>
</div>
<script>
  const out = document.getElementById('vol');
  const btn = document.getElementById('draw');
  const hint = document.getElementById('hint');
  const drumEl = document.getElementById('drum');

  let drum = [];            // the balls still in the drum
  const balls = {};         // number -> element
  let lastBall = null;

  for (let n = 1; n <= 100; n++) {
    const b = document.createElement('div');
    b.className = 'ball';
    b.textContent = n;
    drumEl.appendChild(b);
    balls[n] = b;
  }

  function fillDrum() {
    drum = Array.from({ length: 100 }, (_, i) => i + 1);
    for (const n in balls) balls[n].className = 'ball';
    lastBall = null;
    btn.textContent = 'draw a ball';
    hint.textContent = '100 balls in the drum. no ball goes back in.';
  }
  fillDrum();

  function draw() {
    if (drum.length === 0) { fillDrum(); return; }
    btn.disabled = true;

    // tumble: flash random balls that are still in the drum, then land on one
    let ticks = 0;
    let flash = null;
    const tumble = setInterval(() => {
      if (flash) balls[flash].classList.remove('hot');
      flash = drum[Math.floor(Math.random() * drum.length)];
      balls[flash].classList.add('hot');
      if (++ticks < 12) return;
      clearInterval(tumble);

      // pull one ball out for good (no replacement = no repeats)
      balls[flash].classList.remove('hot');
      const i = drum.indexOf(flash);
      drum.splice(i, 1);
      if (lastBall) balls[lastBall].classList.remove('last');
      balls[flash].classList.add('gone', 'last');
      lastBall = flash;

      out.textContent = flash;   // the ball's number is the volume
      hint.textContent = drum.length + ' left in the drum.';
      if (drum.length === 0) {
        hint.textContent = 'the drum is empty.';
        btn.textContent = 'refill the drum';
      }
      btn.disabled = false;
    }, 50);
  }

  btn.addEventListener('click', draw);
</script>
</body>
</html>
